# ukmesh-planner web container — nginx serving the built SPA, proxying /api to
# the planner API service, and serving the read-only terrain tile mount.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health probe (used by compose healthcheck).
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Resolve upstream at request time via Docker's embedded DNS, so nginx
    # starts even if `api` is not yet up and follows its address across
    # container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Planner API (same-origin contract: the browser only ever talks to this origin).
    location /api/ {
        set $planner_api http://api:8080;
        proxy_pass $planner_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Terrain tiles: read-only bind mount of the existing UK Mesh tile set
    # (decision D-004). Immutable content — long cache, no access logging.
    location /terrain-tiles/ {
        alias /terrain-tiles/;
        access_log off;
        types { image/png png; }
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Conservative default security headers (expanded in Stage 6).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
